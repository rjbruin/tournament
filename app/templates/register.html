{% extends "base.html" %}
{% block title %}Register — WC 2026{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <h2 class="mb-4 text-center">Create an account</h2>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post" action="{{ url_for('auth.register') }}">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}"
                   autocomplete="username" pattern="[a-zA-Z0-9_-]{3,32}" required autofocus>
            <div class="form-text">3-32 characters: letters, numbers, underscore, or hyphen.</div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="new-password" minlength="8" required>
            <div class="form-text">At least 8 characters.</div>
          </div>
          <div class="mb-3">
            <label for="password_confirm" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="password_confirm" name="password_confirm"
                   autocomplete="new-password" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Create account</button>
        </form>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">
      Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
  </div>
</div>

{% endblock %}
